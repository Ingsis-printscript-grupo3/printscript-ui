name: CD

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

env:
  # ghcr exige el nombre en minusculas
  IMAGE: ghcr.io/ingsis-printscript-grupo3/printscript-ui

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # un tag con el nombre de la rama, que se pisa, y otro con el commit, que queda fijo
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
